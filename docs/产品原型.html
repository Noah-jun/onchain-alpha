<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnChain Alpha - 产品原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: {
              900: '#0f1419',
              800: '#1a1f2e',
              700: '#252b3b',
              600: '#2d3548',
              500: '#3d4663',
            },
            accent: {
              blue: '#3b82f6',
              purple: '#8b5cf6',
              red: '#ef4444',
              yellow: '#f59e0b',
              green: '#10b981',
            }
          }
        }
      }
    }
  </style>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1f2e; }
    ::-webkit-scrollbar-thumb { background: #3d4663; border-radius: 3px; }
    
    .signal-card { transition: all 0.2s ease; }
    .signal-card:hover { transform: translateY(-1px); }
    
    .tab-active {
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
    }
    
    .gauge-bg {
      background: conic-gradient(
        from 180deg,
        #10b981 0deg,
        #10b981 54deg,
        #f59e0b 54deg,
        #f59e0b 126deg,
        #ef4444 126deg,
        #ef4444 180deg
      );
    }
    
    .typing-cursor::after {
      content: '|';
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body class="bg-dark-900 min-h-screen text-white">
  
  <div class="flex h-screen">
    
    <!-- Left Sidebar -->

      <!-- Nav Icons -->

    </aside>
    
    <!-- Main Content -->

            </div>
          </div>
          
          <!-- Main Grid -->

            <!-- Signal List (3/5) -->

                <button class="px-3 py-1.5 text-xs font-medium rounded-lg bg-dark-700 text-gray-400 hover:text-white transition-colors">转账</button>

                  <option>最近 7d</option>

              </div>
              
              <!-- Signal Cards -->

                    </div>
                    <div class="text-right">
                      <span class="text-xs bg-accent-red/20 text-accent-red px-2 py-0.5 rounded">高风险</span>
                      <div class="text-xs text-gray-500 mt-1">5分钟前</div>
                    </div>
                  </div>
                  <p class="text-sm text-gray-400 mb-3">地址转移 <span class="text-white">5,000 BTC</span> 到冷钱包，约 <span class="text-white">$215M</span></p>
                  <div class="flex items-center gap-2">
                    <button class="px-3 py-1.5 text-xs bg-accent-blue/20 text-accent-blue rounded-lg hover:bg-accent-blue/30 transition-colors">查看详情</button>
                    <button class="px-3 py-1.5 text-xs bg-dark-700 text-gray-400 rounded-lg hover:bg-dark-600 transition-colors">Etherscan ↗</button>

                <!-- Signal 2 -->

                      <div>

                    </div>
                    <div class="text-right">

                    <span class="px-2 py-1 text-xs bg-accent-green/20 text-accent-green rounded">+0.045%</span>
                    <span class="px-2 py-1 text-xs bg-accent-red/20 text-accent-red rounded">做多情绪</span>
                  </div>
                </div>
                
                <!-- Signal 3 -->
                <div class="signal-card p-4 border-l-2 border-accent-green">
                  <div class="flex items-start justify-between mb-2">
                    <div class="flex items-center gap-3">
                      <div class="w-8 h-8 bg-accent-green/20 rounded-lg flex items-center justify-center text-sm">💸</div>
                      <div>
                        <div class="font-medium text-white text-sm">大额稳定币转账</div>

                    </div>
                    <div class="text-right">
                      <span class="text-xs bg-accent-green/20 text-accent-green px-2 py-0.5 rounded">低风险</span>

                  </div>
                  <p class="text-sm text-gray-400 mb-3">Treasury 转移 <span class="text-white">50M USDC</span> 到 Binance</p>

                  </div>
                </div>
                
              </div>
            </div>
            
            <!-- Right Panel (2/5) -->
            <div class="col-span-2 space-y-4">
              
              <!-- Quick Stats -->
              <div class="bg-dark-800 rounded-xl p-4 border border-dark-600">

            <!-- Right Panel - Chat -->

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
      document.getElementById(`page-${tab}`).classList.remove('hidden');
      
      document.querySelectorAll('[id^="nav-"]').forEach(btn => {
        btn.classList.remove('tab-active');
        btn.classList.add('text-gray-400');
      });
      const activeNav = document.getElementById(`nav-${tab}`);
      activeNav.classList.add('tab-active');
      activeNav.classList.remove('text-gray-400');
    }
